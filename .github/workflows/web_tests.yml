name: Web Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web-tests:
    name: Chrome Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Run widget tests on Chrome
        run: flutter test --platform chrome

  wasm-tests:
    name: Chrome Wasm Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: flutter pub get

      # dart2wasm has no dart:html, so this fails to compile if spot ever
      # reaches for it again. test/act is left out because dart2wasm does not
      # support --track-widget-creation, so the widget creation locations those
      # tests assert on do not exist there.
      - name: Run widget tests on Chrome compiled to Wasm
        run: >
          flutter test --platform chrome --wasm
          test/example_test.dart test/spot/ test/selectors/
          test/screenshot/ test/widgets/ test/fonts/
